name: Deploy
# Runs after CI is green on main (no second test run: Actions minutes are limited, BUILD.md §4.1).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only a green CI run of a push to main in THIS repository deploys (never a PR or a fork); manual runs only from main.
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply D1 migrations
        run: npx tsx scripts/deploy.ts migrate
        env: &deployenv
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          ADMIN_ORIGIN: ${{ vars.ADMIN_ORIGIN }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
      - name: Deploy the public Worker (site + API)
        run: npx tsx scripts/deploy.ts public
        env: *deployenv
      - name: Deploy the Access-protected admin Worker
        run: npx tsx scripts/deploy.ts admin
        env: *deployenv
      - name: Smoke test the live site (production CSS order, map fills the screen, spots draw)
        run: |
          npx playwright install --with-deps chromium
          sleep 10
          npx tsx scripts/smoke-live.ts "${{ vars.SITE_ORIGIN }}"
